<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0d1330"/>
  <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5">
    <!-- input (x=70) to hidden1 (x=170) -->
    <line x1="70" y1="110" x2="170" y2="80"/><line x1="70" y1="110" x2="170" y2="160"/><line x1="70" y1="110" x2="170" y2="240"/><line x1="70" y1="110" x2="170" y2="320"/>
    <line x1="70" y1="200" x2="170" y2="80"/><line x1="70" y1="200" x2="170" y2="160"/><line x1="70" y1="200" x2="170" y2="240"/><line x1="70" y1="200" x2="170" y2="320"/>
    <line x1="70" y1="290" x2="170" y2="80"/><line x1="70" y1="290" x2="170" y2="160"/><line x1="70" y1="290" x2="170" y2="240"/><line x1="70" y1="290" x2="170" y2="320"/>
    <!-- hidden1 to hidden2 (x=260) -->
    <line x1="170" y1="80" x2="260" y2="110"/><line x1="170" y1="80" x2="260" y2="200"/><line x1="170" y1="80" x2="260" y2="290"/>
    <line x1="170" y1="160" x2="260" y2="110"/><line x1="170" y1="160" x2="260" y2="200"/><line x1="170" y1="160" x2="260" y2="290"/>
    <line x1="170" y1="240" x2="260" y2="110"/><line x1="170" y1="240" x2="260" y2="200"/><line x1="170" y1="240" x2="260" y2="290"/>
    <line x1="170" y1="320" x2="260" y2="110"/><line x1="170" y1="320" x2="260" y2="200"/><line x1="170" y1="320" x2="260" y2="290"/>
    <!-- hidden2 to output (x=340) -->
    <line x1="260" y1="110" x2="340" y2="160"/><line x1="260" y1="110" x2="340" y2="240"/>
    <line x1="260" y1="200" x2="340" y2="160"/><line x1="260" y1="200" x2="340" y2="240"/>
    <line x1="260" y1="290" x2="340" y2="160"/><line x1="260" y1="290" x2="340" y2="240"/>
  </g>
  <g fill="#6366f1" stroke="#ffffff" stroke-width="2">
    <circle cx="70" cy="110" r="16"/><circle cx="70" cy="200" r="16"/><circle cx="70" cy="290" r="16"/>
  </g>
  <g fill="#22d3ee" stroke="#ffffff" stroke-width="2">
    <circle cx="170" cy="80" r="14"/><circle cx="170" cy="160" r="14"/><circle cx="170" cy="240" r="14"/><circle cx="170" cy="320" r="14"/>
    <circle cx="260" cy="110" r="14"/><circle cx="260" cy="200" r="14"/><circle cx="260" cy="290" r="14"/>
  </g>
  <g fill="#f472b6" stroke="#ffffff" stroke-width="2">
    <circle cx="340" cy="160" r="16"/><circle cx="340" cy="240" r="16"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    <text x="70" y="370">Input</text><text x="215" y="370">Hidden Layers</text><text x="340" y="370">Output</text>
  </g>
  <text x="200" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Neural Network</text>
</svg>
